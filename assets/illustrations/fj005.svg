<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.58  0 0 0 0 0.45  0 0 0 0.035 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="#f8f4ea"/>
  <rect x="0" y="0" width="1024" height="1024" filter="url(#paper)" opacity="0.55"/>

  <!-- 极淡的水色晕染 -->
  <ellipse cx="330" cy="330" rx="300" ry="260" fill="#dce8cf" opacity="0.35"/>
  <ellipse cx="700" cy="700" rx="260" ry="230" fill="#f0e2c8" opacity="0.4"/>

  <!-- 茶枝（由左上向右下） -->
  <path d="M150 180 C 320 120, 470 420, 700 760" fill="none" stroke="#6c7a56" stroke-width="14" stroke-linecap="round"/>
  <path d="M150 180 C 320 120, 470 420, 700 760" fill="none" stroke="#8b966f" stroke-width="6" stroke-linecap="round" opacity="0.55"/>

  <!-- 叶片（线稿 + 淡彩） -->
  <g transform="translate(280 240) rotate(-18)">
    <path d="M0 0 C 22 -26, 64 -28, 96 -4 C 62 20, 22 18, 0 0 Z" fill="#cfe0bd" stroke="#6d7f57" stroke-width="4"/>
    <path d="M4 0 C 30 -6, 62 -8, 90 -4" fill="none" stroke="#6d7f57" stroke-width="3"/>
  </g>
  <g transform="translate(420 340) rotate(28)">
    <path d="M0 0 C 24 -28, 68 -30, 102 -4 C 66 22, 24 20, 0 0 Z" fill="#bcd6a8" stroke="#6d7f57" stroke-width="4"/>
    <path d="M4 0 C 32 -6, 66 -8, 96 -4" fill="none" stroke="#6d7f57" stroke-width="3"/>
  </g>
  <g transform="translate(520 440) rotate(-38)">
    <path d="M0 0 C 20 -24, 60 -26, 92 -4 C 60 18, 20 16, 0 0 Z" fill="#cfe0bd" stroke="#6d7f57" stroke-width="4"/>
    <path d="M4 0 C 30 -6, 62 -8, 88 -4" fill="none" stroke="#6d7f57" stroke-width="3"/>
  </g>
  <g transform="translate(600 520) rotate(18)">
    <path d="M0 0 C 22 -26, 64 -28, 96 -4 C 62 20, 22 18, 0 0 Z" fill="#c3d9ad" stroke="#6d7f57" stroke-width="4"/>
    <path d="M4 0 C 30 -6, 62 -8, 90 -4" fill="none" stroke="#6d7f57" stroke-width="3"/>
  </g>
  <g transform="translate(668 610) rotate(-22)">
    <path d="M0 0 C 20 -24, 60 -26, 92 -4 C 60 18, 20 16, 0 0 Z" fill="#d5e4c5" stroke="#6d7f57" stroke-width="4"/>
    <path d="M4 0 C 30 -6, 62 -8, 88 -4" fill="none" stroke="#6d7f57" stroke-width="3"/>
  </g>
  <g transform="translate(232 196) rotate(42)">
    <path d="M0 0 C 14 -18, 42 -20, 66 -3 C 42 12, 14 12, 0 0 Z" fill="#bcd6a8" stroke="#6d7f57" stroke-width="4"/>
  </g>
  <g transform="translate(470 380) rotate(-58)">
    <path d="M0 0 C 14 -18, 42 -20, 66 -3 C 42 12, 14 12, 0 0 Z" fill="#cfe0bd" stroke="#6d7f57" stroke-width="4"/>
  </g>
  <g transform="translate(724 690) rotate(12)">
    <path d="M0 0 C 18 -22, 52 -24, 80 -3 C 52 16, 18 14, 0 0 Z" fill="#d5e4c5" stroke="#6d7f57" stroke-width="4"/>
  </g>

  <!-- 芽头 -->
  <g transform="translate(700 760)">
    <circle cx="0" cy="0" r="9" fill="#8ea876" stroke="#5f6b4e" stroke-width="3"/>
    <path d="M8 -4 C 18 -18, 34 -20, 46 -10 C 32 -2, 18 0, 8 -4 Z" fill="#cfe0bd" stroke="#6d7f57" stroke-width="3"/>
    <circle cx="36" cy="-14" r="6" fill="#8ea876" stroke="#5f6b4e" stroke-width="3"/>
  </g>

  <!-- 茶盏 -->
  <g transform="translate(430 740)">
    <ellipse cx="150" cy="150" rx="150" ry="34" fill="#d8b84c" stroke="#8a7a5a" stroke-width="5"/>
    <path d="M0 150 C 0 250, 300 250, 300 150 Z" fill="#f7efdc" stroke="#8a7a5a" stroke-width="5"/>
    <path d="M26 150 C 26 216, 274 216, 274 150" fill="none" stroke="#c9b98f" stroke-width="3" opacity="0.7"/>
    <!-- 热气 -->
    <path d="M120 96 C 132 76, 116 58, 130 38" fill="none" stroke="#b9b2a1" stroke-width="4" stroke-linecap="round"/>
    <path d="M176 100 C 188 80, 172 62, 186 42" fill="none" stroke="#b9b2a1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 落款：物产名 -->
  <text x="96" y="906" font-family="'Kaiti SC','STKaiti','KaiTi','Songti SC',serif" font-size="72" fill="#4d5140" letter-spacing="10">武夷岩茶</text>
  <text x="102" y="958" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#8a8f7c" letter-spacing="6">FJ005 · 茶 · 乌龙茶</text>
</svg>
